# See https://prettier.io/docs/ci
name: autofix.ci
on:
  pull_request:
    paths:
      - "website/**"
  push:
    paths:
      - "website/**"
permissions: {}
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format website
        run: pnpm run check:fix
      # autofix.ci pushes the formatting fix, but it needs the autofix.ci GitHub App
      # installed on the repository. Upstream has it; forks generally do not, so on a
      # fork we just fail the job with the diff and let the author run
      # `pnpm run check:fix` locally.
      - uses: autofix-ci/action@v1
        if: github.repository_owner == 'SynthstromAudible'
        with:
          commit-message: "Apply Prettier format"

      - name: Check formatting (no autofix.ci app on this repo)
        if: github.repository_owner != 'SynthstromAudible'
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Website formatting is out of date. Run 'pnpm run check:fix' in website/ and commit the result."
            git diff
            exit 1
          fi
